# Secretos: llegan por variables de entorno o, en desarrollo, por config/local-secrets.properties (gitignored).
spring.config.import=optional:file:./config/local-secrets.properties

server.port=8083
# MySQL datasource (Docker compose: mysql:5.7 on localhost:3306)
spring.datasource.url=jdbc:mysql://localhost:3306/storeweb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Flyway: V1 = esquema existente (baseline); los cambios van desde V2
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=storeweb
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# JWT: usa un secreto de 32+ bytes
security.jwt.secret=${JWT_SECRET}
# GraphQL
#spring.graphql.path=/graphql
# Habilitar la consola GraphiQL integrada
#spring.graphql.graphiql.enabled=true
# Usar CDN para assets de GraphiQL y evitar issues con webjars
#spring.graphql.graphiql.cdn.enabled=false
# CORS básico para GraphQL (ajusta orígenes según tu frontend)
#spring.graphql.cors.allowed-origins=*
#spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
#spring.graphql.cors.allowed-headers=*
spring.docker.compose.enabled=false
# Logging detallado para diagnosticar GraphQL fuera del perfil dev
#logging.level.org.springframework.graphql=DEBUG
logging.level.com.essenza.tienda=DEBUG
spring.jackson.property-naming-strategy=SNAKE_CASE
# Swagger en snake_case: lo aplica el bean ModelResolver de config/OpenApiConfig (springdoc no tiene propiedad para esto)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=ERROR

# Fase 5 · Reservas de stock de órdenes pendientes: caducan pasado este plazo (ISO-8601) y se revisan cada intervalo.
essenza.orders.reservation-ttl=PT24H
essenza.orders.expiry-check-interval=PT15M

# --- Validacion de tokens de access_control (essenza-security, Fase 4) ---
essenza.security.issuer=${ACCESS_CONTROL_OAUTH2_ISSUER:http://localhost:8000}
essenza.security.jwks-uri=${ACCESS_CONTROL_JWKS_URI:}
# Codigos de las aplicaciones (access_control > Applications, en minusculas, sin tildes, con guiones)
# cuyos tokens acepta este servicio.
essenza.security.audiences=${DRACO_OAUTH2_AUDIENCES:essenza}
essenza.security.accept-legacy=${DRACO_ACCEPT_LEGACY_TOKENS:true}
essenza.security.legacy-secret=${JWT_SECRET:}
essenza.security.legacy-issuer=access-control-service
# Modo observacion hasta conocer los clientes: false = no bloquea, solo registra rutas sin token.
essenza.security.enforce-authentication=${DRACO_ENFORCE_AUTH:false}
# Rutas publicas (patrones Ant, separados por coma). Completar tras revisar el log del modo observacion.
essenza.security.rutas-publicas=${DRACO_RUTAS_PUBLICAS:}
# Propuesta inicial (lectura de la vitrina de la tienda). Confirmar con el log del modo observacion.
essenza.security.rutas-publicas-get=${DRACO_RUTAS_PUBLICAS_GET:/api/shop/catalog/**,/api/shop/product_details/**,/api/shop/reviews/**,/api/shop/recommendations/**,/api/shop/cms/**}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# --- Pagos (medios físicos y virtuales) ---
# URL pública del backend: se usa para los webhooks y el simulador de pagos.
essenza.payments.public-base-url=${PAYMENTS_PUBLIC_BASE_URL:http://localhost:8083}
# A dónde vuelve el cliente al terminar un pago en línea (tienda).
essenza.payments.default-return-url=${PAYMENTS_RETURN_URL:http://localhost:3000/checkout/resultado}
# Simulador de pasarela (solo pruebas): desactivar en producción.
essenza.payments.sandbox.enabled=${PAYMENTS_SANDBOX_ENABLED:true}
essenza.payments.sandbox.secret=${PAYMENTS_SANDBOX_SECRET:essenza-sandbox}
# Wompi: llaves del panel de comercios (pub_test_/prv_test_ = sandbox). Webhook: <public-base-url>/api/shop/sales/payments/webhooks/wompi
essenza.payments.wompi.public-key=${WOMPI_PUBLIC_KEY:}
essenza.payments.wompi.private-key=${WOMPI_PRIVATE_KEY:}
essenza.payments.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
essenza.payments.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
# Mercado Pago: access token (TEST-… = pruebas) y clave secreta de webhooks. Webhook: <public-base-url>/api/shop/sales/payments/webhooks/mercado_pago
essenza.payments.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
essenza.payments.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# Facturación electrónica (V9). Proveedor por defecto: simulador (ACCEPT | REJECT | OFFLINE para pruebas).
essenza.billing.simulator.enabled=${BILLING_SIMULATOR_ENABLED:true}
essenza.billing.simulator.mode=${BILLING_SIMULATOR_MODE:ACCEPT}

# --- Registro central de personas (access_control) ---
# Las ordenes cargan el cliente por numero de documento (GET /api/access_control/persons/lookup)
# con un token de servicio client_credentials (scope persons.read). Sin secreto: deshabilitado.
essenza.access-control.base-url=${ACCESS_CONTROL_URL:http://localhost:8000}
essenza.access-control.token-url=${ACCESS_CONTROL_TOKEN_URL:}
essenza.access-control.client-id=${ESSENZA_TIENDA_SERVICE_CLIENT_ID:essenza-tienda-service}
essenza.access-control.client-secret=${ESSENZA_TIENDA_SERVICE_CLIENT_SECRET:}
